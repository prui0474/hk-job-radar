# =====================================================================
# 香港岗位雷达 · 配置模板
# 使用方法：复制本文件为同目录下的 config.yaml，再按需修改。
#   Windows PowerShell:  Copy-Item config.example.yaml config.yaml
# config.yaml 已加入 .gitignore，凭据永不入库。
# 配置只在进程启动时读取一次，修改后需重启生效（PRD P0-7 约定）。
# =====================================================================

# ---- 抓取站点开关 ----
# true = 启用该站监控。
# ⚠️ LinkedIn 请务必用【求职专用小号】登录一次（python run.py login linkedin），
#    主号的人脉与推荐信资产不要暴露在自动化活动中；未登录会被节流跳登录墙。
# ⚠️ Indeed 会拦截无头浏览器，抓取时会弹出一个可见的浏览器窗口（属正常现象），
#    请勿在抓取进行中关闭该窗口。
sources:
  jobsdb: true
  linkedin: true
  indeed: true
  # 企业官网（Workday）：不登录、不验证码、纯 HTTP 读公司自己的招聘系统。
  # 三个招聘网站上会重复、会过期、发布时间还可能拿不到；这一条直接读雇主的
  # 招聘系统，能拿到发布时间、完整 JD，以及一句明确的「还在收简历吗」。
  # 内置几家香港机构，想加自己的目标公司改 data/workday_employers.yaml
  #（格式见 data/workday_employers.example.yaml）。
  workday: true
  # 校招站（*.tal.net，Oleeo 平台）：外资投行 / 资管的 campus 招聘站，
  # 含 Jefferies、Fidelity 等——Summer Analyst / Off-Cycle 这类岗位只在
  # 这里，三大站和 Workday 都抓不到。纯 HTTP、不开浏览器、不抓详情页。
  # 默认关闭：你关心的公司可能不在这两家，按需打开。
  # 想加自己的目标公司改 data/talnet_boards.yaml（格式同 workday 那份）。
  talnet: false

# =============================================================================
#  ★★ 拿到本文件后第一件事：把下面的关键词换成【你自己的求职方向】★★
# =============================================================================
# 作用：只有「岗位标题或摘要」命中这里任一关键词的岗位，才会进入 AI 打分环节；
#      其余直接丢弃。这一层是免费的（纯字符串匹配），专门用来把噪音挡在
#      按次计费的 AI 打分之前。
#
# 💡 数量不限：想铺多少铺多少（实际经验是 10–20 个比较合适，再多噪音会上升）。
#    诀窍是「一个方向一个词」——数据、量化、银行管培各铺几个，别写句子。
#
# 怎么填 —— 四条规则，照着做就不会踩坑：
#
#   1) 写「岗位名称」，一行一个。【中英文都可以，大小写不敏感】
#      ★【不是必须两种都写】：只找英文岗就只写英文；想覆盖中文岗再补中文词。
#        两种都写覆盖更全，但每多一个词，每轮多抓 1 页/站。
#      （"DATA ANALYST" 与 "data analyst" 完全等价，程序加载时会统一转小写）。
#      香港招聘网站上中英混写是常态，【只写英文会漏掉纯中文标题的岗位】：
#      纯中文标题（「數據分析員」「市場分析員」）在【初筛层必然被漏掉】
#      （初筛按字面匹配，中文标题里没有英文字符）——这是硬伤；
#      搜索侧召回率也明显偏低（实测英文关键词能带回一部分中文标题岗位，
#      但占比只有 7% 左右）。中文岗位在中资公司、本地中小企里占比不小。
#      ★ 中文要【繁简各写一份】：程序不做繁简转换，"數據分析" 匹配不到 "数据分析"。
#        香港本地公司多用繁体（數據 / 資料 / 機器學習 / 演算法 / 風險），
#        中资公司多用简体（数据 / 资料 / 机器学习 / 算法 / 风险）。
#      ★ 中文别只写一个短词（如「分析」）——子串匹配会让「財務分析」「市場分析」
#        「信用分析」全部命中，等于取消初筛。写完整岗位名（「數據分析員」）。
#
#   2) 【只写岗位名称，绝不写技能名词】。
#      因为匹配范围包含岗位描述，而 "python" / "sql" / "excel" / "power bi"
#      这类技能词几乎每份 JD 都会提到——加进去等于没有筛选，AI 费用白花。
#
#   3) 【不要写两三个字母的英文短词，也不要写中文的泛词】。
#      短词别写：招聘站会把 "ai" 当模糊词，返回一堆无关岗位（邮箱营销、
#      排班表、简历类内容），白占每日配额与 AI 打分费用。"cv" 更麻烦，
#      它本身就有「简历」的意思。
#      想让方向覆盖更宽，用下面的 title_direction_hints（只作用于标题），
#      而不是把短词塞进 keywords。
#      中文同理：中文没有词边界，"分析" 会命中「財務分析」「市場分析」，
#      "数据" 会命中「数据输入员」。要写就写完整岗位名。
#
#   4) 【更具体的词写在前面】。
#      程序取"列表中第一个命中的词"作为命中记录，所以 "data scientist" 必须排在
#      "data science" 之前，否则记录的关键词会不准确。
#
# 下面这个列表【留给你自己填】—— 模板刻意不预置任何岗位名称，
# 因为「你想找什么」只有你自己知道，照抄别人的词只会抓错岗位。
# 不确定写什么？打开 JobsDB 搜你想要的岗位，把标题里反复出现的词抄下来即可。
#
# 填法举例（把 "# " 去掉，再换成你自己的词）：
# keywords:
#   - "data analyst"
#   - "business analyst"
#   # 中文要繁简各写一份，否则只会命中其中一种写法
#   - "數據分析員"
#   - "数据分析员"
#   - "商業分析師"
#   - "商业分析师"
keywords: []

# ---- 毕业生项目关键词（可选，面向"毕业前一年"的在读学生）----
# 有些岗位（银行管培生 Management Trainee、毕业生培训计划等）在招聘网站上是
# full-time，但【入职时间在毕业之后】。如果你还在读，这类岗位正是应该提前一年投的
# 高价值目标，所以单独放一个列表：系统会用「全职」类型的 URL 过滤去抓它们，
# 与上面的普通关键词（用 job_types 的实习/兼职过滤）分开，避免被当成"违法全职"误杀。
# 不需要（已毕业 / 不想投管培生）→ 留空即可。
#
# 提醒：这里的词与上面的普通关键词各算各的，合计数量不限。
#
# 填法举例：
# graduate_keywords:
#   - "management trainee"
#   - "graduate programme"
graduate_keywords: []

# 关键词同义词映射（可选）：value 里的词命中后，归入 key 所代表的主关键词。
# 用途举例：你写了 "data analyst"，但有些岗位标题写的是 "data analytics"，
#          把后者填进同义词，它就会被算作命中 "data analyst"。
# 规则：主关键词必须出现在上面的 keywords 列表里，否则它的同义词不会生效。
# 注意：同义词同样是子串匹配，所以同样只放岗位名称，不放技能名词。
# 填法举例：
# keyword_synonyms:
#   "data analyst": ["data analytics"]
keyword_synonyms: {}

# 标题方向词直通（可选，默认关闭 = 行为与不写这一项完全一样）
# 作用：只要岗位**标题**里出现下面任一词，即使它没命中上面的 keywords，
#      也放行进 LLM 打分，由 LLM 按你的画像判断相关性。
# 什么时候该用：你的 keywords 都是「完整岗位名」（data analyst），但招聘站上
#      真实标题写法更自由——"AI R&D Engineering Intern" 不含 "ai engineer"、
#      "Investment Risk Management Intern" 不含任何关键词，于是被当噪音丢掉。
#      填方向词能把它们捞回来。
# 只认标题，不认岗位描述——JD 正文里 "data-driven"、"AI-powered" 遍地都是，
#      放开描述等于取消初筛。
# 自动加词首边界，所以 "ai" 不会命中 email / retail；两个字母的词还会加词尾
#      边界（"ai" 不命中 air），三个字母以上不加（"llm" 仍能命中 LLMs）。
# ★ 中文方向词【只写岗位名后缀】，不要写单个词根：中文没有词边界，写「分析」
#   会把「財務分析」「市場分析」「信用分析」全部放行，等于取消初筛；
#   写「分析員 / 分析師」才只命中真正以该岗位名结尾的标题。
#   繁体简体各写一份，理由同上面的 keywords（不做繁简转换）。
# 填法举例（数据 + AI 方向）：
# title_direction_hints:
#   - "data"
#   - "analytic"
#   - "ai"
#   - "machine learning"
#   - "llm"
#   - "分析員"      # 中文岗位名后缀（繁体）
#   - "分析师"      # 简体写一份，否则简体标题漏掉
title_direction_hints: []

# ---- 求职阶段（决定抓哪些岗位类型，★必填★）----
#   student  → 在读学生：只抓「实习 / 兼职」
#              （学生签证在读期间做全职是违法的，这是合规底线）
#   graduate → 已毕业 / 持 IANG：只抓「全职」（含管培生、毕业生培训计划）
#   both     → 毕业前后过渡期：实习、兼职、全职全都要
#
# 选错的影响：student 会漏掉所有全职岗；graduate 会漏掉所有实习岗。
# 不确定就先用 both，等看清哪类岗位更值得投，再收窄。
career_stage: student

location: "Hong Kong"          # 抓取目标地区

# ---- 岗位类型过滤（高级覆盖项，通常不用动）----
# ⚠️ 上面有了 career_stage 之后，这里【一般不需要写】：
#    程序会按 career_stage 自动推导 job_types。
#    只有当你想做 career_stage 覆盖不到的精细控制时，才手写这个列表
#    （例如 student 但想同时看全职）。一旦写了，就以你写的为准。
#
# 所有岗位在进入日报前还会过一道「岗位类型安全网」：不符合的类型直接剔除，
# 因此永远不会出现"URL 过滤没生效、混进违法全职岗"的情况。
#
# 可取值：internship / part time / contract / temporary / full time
#   contract、temporary = 有明确结束日的合同制岗。对在读学生来说它们和实习/兼职
#   一样合规（学业结束后身份失效，但合同本来就会到期），实测这类岗位里
#   "Junior"、"Open to Fresh Graduates"、"6 months contract" 的比例明显更高。
#   full time = 全职长工。**在读学生不要开**（除非岗位明确是毕业后入职）。
# job_types:
#   - "internship"
#   - "part time"
#   - "contract"

# ---- 抓取频率与防封号（P0-2）----
poll_interval_minutes: 30      # 轮询间隔，推荐 15-30 分钟
human_delay:                   # 每次页面导航之间的随机延迟（秒），模拟人类操作
  min_s: 2
  max_s: 8
daily_limits:                  # 每站点"每日抓取页数"上限（香港自然日），触发即停并记日志
  jobsdb: 150
  linkedin: 40
  indeed: 40
  # Workday 的一"页"= 一次岗位列表请求（20 条）。一轮完整扫描约 10–15 页，
  # 写 120 大约够扫十轮；不写这一项等于不限量，轮询间隔一短就会反复全量扫。
  workday: 120
  # talnet 的一"页"= 一次 board 请求（50 条）。两家 board 各 1–2 页就覆盖全部
  # 校招岗；它的 robots.txt 写了 Crawl-delay: 10，所以配额压到最低。
  talnet: 20

# ---- 关键词轮转（每轮抓几个关键词，P0-2 配套）----
# 初筛是「逐关键词搜索」，每搜索一个关键词就吃掉 1–2 页每日配额（配额按香港自然日
# 0 点重置，不用就作废）。所以"每轮抓几个关键词"要跟你的开机习惯匹配：
#
#   → 电脑 24 小时常开：用 auto。auto = 每日配额 ÷ 当日轮数，把配额摊到全天，
#     避免开机头几小时烧光、之后一整天抓不到东西（那时全天都在空转）。
#   → 每天只开一小会儿：用 all。反正开机时间短，开一次就尽量把关键词全扫一遍，
#     配额不用白不用（配额按自然日 0 点重置，不用就作废）。
#
#   per_cycle: auto → 按每日配额 ÷ 当日轮数自动推算每轮抓几个（电脑常开时用这个）
#   per_cycle: all  → 每轮抓全部关键词（每天只开机十几分钟时用这个）
#   per_cycle: 5    → 每轮固定抓 5 个关键词
#
# per_source：按站点覆盖上面的值。LinkedIn 对自动化流量最敏感（而且每个关键词还要
# 翻 2 页），所以即便其他站一轮全量，也可以让它小步慢走、靠跨轮轮转慢慢覆盖全部关键词。
keyword_rotation:
  per_cycle: auto
  per_source:
    # linkedin: 3     # 想让最敏感的 LinkedIn 小步慢走，就把这行取消注释

# ---- 浏览器行为 ----
browser:
  headless: true               # 无头模式（不弹浏览器窗口）。实测有头模式翻多页会崩
                               # 溃（Page crashed）。无头模式更稳，但需要下一项配合。

  # 无头时是否把 UA 里的 "HeadlessChrome" 换成 "Chrome"。
  #
  # 默认开启。JobsDB 和 Indeed 前面的 Cloudflare 用 UA 判机器人，无头浏览器
  # 默认会在 UA 里自报 HeadlessChrome，于是验证页一直不放行。
  #
  # 2026-11-12 实测，同一台机器、同一份启动参数，只差 UA 里这一个词：
  #   UA 带 HeadlessChrome → JobsDB 的验证页 45 秒不放行，抓到 0 个岗位；
  #   换成 Chrome          → 没有出现验证页，3.6 秒抓到 30 个岗位。
  #
  # 开启后只替换这一个词，浏览器版本号、页面内容、其他请求头都不动。
  # 不想要这一项的话，改成 false 即可，代价是无头模式下这两个站大概率抓不到
  # 岗位（日志里仍然显示抓取完成，只是数量为 0）。
  hide_headless: true

  cloudflare_wait_seconds: 45  # 遇到挑战页的最长等待时间（只等待，绝不破解）

  # 浏览器走不走代理。如果直连香港网站很慢、或安全验证一直转圈，这一项
  # 就是给这种情况准备的。三种填法：
  #
  #   ""                      默认留空 → 强制直连，忽略系统代理设置。
  #   "system"                跟随系统里设的代理。代理软件开的是「系统代理
  #                           模式」时填这个。
  #   "http://127.0.0.1:7890" 指定具体地址（端口按你代理软件里显示的改）。
  #
  # 不确定填哪个：双击 doctor.bat，看「网络出口」那一项。它通了就不用改；
  # 不通且提示「检测到系统代理」就填 system。
  # 代理软件开的是 TUN / 虚拟网卡模式时，留空也能通（那种模式在网络层接管
  # 流量，浏览器感知不到），所以不必改这一项。
  proxy: ""

# ---- LLM 打分（P0-4）----
llm:
  provider: "deepseek"
  base_url: "https://api.deepseek.com"
  model: "deepseek-chat"
  # API key 的读取顺序：① 环境变量 ② 项目根目录的 api_key.txt
  # 最省事：在本文件同级目录建一个 api_key.txt，里面只写 sk- 开头那一串即可。
  # 也可以走环境变量（变量名在此指定，值永不写进配置/代码/日志）：
  #   PowerShell 临时： $env:DEEPSEEK_API_KEY = "sk-xxxx"
  #   PowerShell 永久： setx DEEPSEEK_API_KEY "sk-xxxx"（设置后要重开窗口）
  api_key_env: "DEEPSEEK_API_KEY"
  timeout_seconds: 20          # 单岗位打分超时（验收要求 <5 秒，留足网络余量）

score_threshold: 60            # 低于此分的岗位不进日报
realtime_threshold: 80         # ≥ 此分的新岗位不等日报、发现即推送（香港的岗位常
                               # 上午挂出下午就约面，这一档就是抢时间用的）
show_unscored: true            # LLM 打分失败降级为"未打分"的岗位是否仍进日报
                               # （默认 true：宁可多看，不可漏看）
max_job_age_days: 2            # 岗位新鲜度上限：只保留最近 N 天内发布的岗位（默认 2 天）
report_max_age_days: 3         # 推送时效线：进库超过 N 天还没推出去的岗位不再推送，直接归档
                               # 只对【无法复核】的站点生效（LinkedIn——它禁止机器人，
                               # 本程序不点它的详情页，只能靠天数兜）。
                               # 为什么需要它：max_job_age_days 只管「抓取入口」，
                               # 已经进了库的岗位不会变旧。电脑关几天再开，队列里会攒下
                               # 一批早就招满的岗位，不拦就会一次性推给你。
liveness_check: true           # 推送前复核：打开岗位详情页，看到「已过期 / 不再接受申请」
                               # 就从本轮剔除（只对 Indeed / JobsDB 生效；LinkedIn 协议
                               # 禁止机器人，本程序不点它的详情页）。
                               # ★ 开着它时，能复核的站点（JobsDB / Indeed / 企业官网）
                               #   不再按天数砍——老的岗位先复核，确认还在招就照常推，
                               #   只留 30 天这道硬上限。因为「老」不等于「失效」。
                               # 关掉它就退回「一律按 report_max_age_days 砍」。

# =============================================================================
#  推送设置（★必须配好一个通道，否则收不到任何消息★）
# =============================================================================
# 四个通道【完全平等】，任选其一填在 channels 里即可。没有"默认通道"。
#
# 💡 可以同时开多个：channels 里写几个，日报和秒推就同时发到几处
#    （比如 Telegram 看推送、邮件留档）。只写一个也完全够用。
#
# 怎么选（都是免费的）：
#   wecom    企业微信群机器人 —— 腾讯官方、免费、无条数上限、消息进微信。内地可用。
#            步骤：手机装「企业微信」→ 注册（企业名称随便填）→ 建一个只有自己的群
#                  → 群设置 → 群机器人 → 添加 → 复制 Webhook 地址，填到下面。
#            可选：在企业微信里「我 → 设置 → 微信绑定」，之后个人微信也能收。
#   email    邮件 —— 最通用，能发排好版的 HTML 岗位卡片，不需要任何第三方平台。
#            注意：auth_code 是邮箱后台生成的【授权码】，不是你的登录密码！
#            QQ 邮箱：设置 → 账户 → 开启 SMTP 服务 → 生成授权码。
#   telegram Telegram —— 需要能访问 Telegram 的网络环境（内地需自备网络条件）。
#            它与其它三个通道地位完全相同，不是特殊通道。
#            步骤：与 @BotFather 对话创建机器人拿 token；给机器人发一条 /start，
#                  再访问 https://api.telegram.org/bot<TOKEN>/getUpdates 取 chat_id。
#   wxpusher WxPusher —— 扫码即用，但属第三方服务、有免费额度上限。
#            步骤：打开 wxpusher.zjiecode.com → 微信扫码登录 → 创建应用拿 appToken
#                  → 「用户管理」里复制你的 UID。
#
# 只填你启用的那一个通道，其余整段保持默认即可。
notify:
  channels:
    - "wecom"                  # ← 改成你要用的通道：wecom / email / telegram / wxpusher

  wecom:
    webhook: ""                # 形如 https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxxx

  email:
    smtp_host: "smtp.qq.com"   # QQ: smtp.qq.com / 163: smtp.163.com / Gmail: smtp.gmail.com
    smtp_port: 465             # 端口决定加密方式：465 = 一上来就 SSL，587 = 先明文再 STARTTLS
    user: ""                   # 你的完整邮箱地址，如 you@qq.com
    auth_code: ""              # ★ 邮箱授权码，不是登录密码（要去邮箱后台单独生成）
    to: ""                     # 收件邮箱，可与 user 相同；多个用逗号分隔
    use_ssl: true              # 只在 smtp_port 不是 465 / 587 时才生效
    # 为什么 use_ssl 现在多半不用管：程序按端口自动选加密方式（465 走 SSL，587 走 STARTTLS）。
    # 以前这里只看 use_ssl，端口填 465 却写了 false 就必然连不上，报错只有一句
    # Connection unexpectedly closed，完全看不出是配置问题。
    # ⚠️ 163 / 126 邮箱还要先去「设置 → POP3/SMTP/IMAP」把 SMTP 服务打开，否则授权码对了也登不上。
    # ⚠️ 收不到邮件先去垃圾箱看一眼，标记为「非垃圾邮件」，之后就会正常进收件箱。

  telegram:
    bot_token: ""              # 与 @BotFather 创建的机器人 token，形如 123456:ABC-xxx
    chat_id: ""

  wxpusher:
    app_token: ""              # 形如 AT_xxxxxx
    uids: []                   # 你的 UID 列表，如 ["UID_xxxxxx"]

feedback_poll_seconds: 60      # 反馈按钮轮询间隔（仅 Telegram 支持点击反馈，其它通道会自动跳过）

# ---- 日报 ----
report_time: "09:00"           # 每日日报推送时间（香港时区，HH:MM）
                               # 手动补发随时可做（report_now）。
# report_times:                # 想一天发多份就把下面打开（写了就以这里为准）
#   - "09:00"
#   - "18:30"
