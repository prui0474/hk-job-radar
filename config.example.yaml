# =====================================================================
# 香港岗位雷达 · 配置模板
# 使用方法：复制本文件为同目录下的 config.yaml，再按需修改。
#   Windows PowerShell:  Copy-Item config.example.yaml config.yaml
# config.yaml 已加入 .gitignore，凭据永不入库。
# 配置只在进程启动时读取一次，修改后需重启生效（PRD P0-7 约定）。
# =====================================================================

# ---- 抓取站点开关 ----
# true = 启用该站监控。
# ⚠️ LinkedIn 请务必用【求职专用小号】登录一次（python run.py login linkedin），
#    主号的人脉与推荐信资产不要暴露在自动化活动中；未登录会被节流跳登录墙。
# ⚠️ Indeed 会拦截无头浏览器，抓取时会弹出一个可见的浏览器窗口（属正常现象），
#    请勿在抓取进行中关闭该窗口。
sources:
  jobsdb: true
  linkedin: true
  indeed: true

# =============================================================================
#  ★★ 拿到本文件后第一件事：把下面的关键词换成【你自己的求职方向】★★
# =============================================================================
# 作用：只有「岗位标题或摘要」命中这里任一关键词的岗位，才会进入 AI 打分环节；
#      其余直接丢弃。这一层是免费的（纯字符串匹配），专门用来把噪音挡在
#      按次计费的 AI 打分之前。
#
# 💡 免费版额度：关键词【最多 7 个】（普通关键词 + 下面毕业生项目关键词合计）。
#    写了更多也不会报错，程序会按顺序只用前 7 个，并在日志里提醒你。
#    7 个通常够用——按「一个方向一个词」来选即可。
#
# 怎么填 —— 四条规则，照着做就不会踩坑：
#
#   1) 写「岗位名称」，英文小写，一行一个。
#      香港招聘网站的岗位标题以英文为主，所以用英文词命中率最高。
#
#   2) 【只写岗位名称，绝不写技能名词】。
#      因为匹配范围包含岗位描述，而 "python" / "sql" / "excel" / "power bi"
#      这类技能词几乎每份 JD 都会提到——加进去等于没有筛选，AI 费用白花。
#
#   3) 【不要写两三个字母的短词】。
#      "ai" 会命中 email / available / certain；"ml" 会命中 html / xml；
#      "cv" 会命中简历（CV）。凡是想搜的方向，把【全称】完整写出来，不要只写缩写。
#
#   4) 【更具体的词写在前面】。
#      程序取"列表中第一个命中的词"作为命中记录，所以 "data scientist" 必须排在
#      "data science" 之前，否则记录的关键词会不准确。
#
# 下面这个列表【留给你自己填】—— 模板刻意不预置任何岗位名称，
# 因为「你想找什么」只有你自己知道，照抄别人的词只会抓错岗位。
# 不确定写什么？打开 JobsDB 搜你想要的岗位，把标题里反复出现的词抄下来即可。
#
# 填法举例（把 "# " 去掉，再换成你自己的词）：
# keywords:
#   - "data analyst"
#   - "business analyst"
keywords: []

# ---- 毕业生项目关键词（可选，面向"毕业前一年"的在读学生）----
# 有些岗位（银行管培生 Management Trainee、毕业生培训计划等）在招聘网站上是
# full-time，但【入职时间在毕业之后】。如果你还在读，这类岗位正是应该提前一年投的
# 高价值目标，所以单独放一个列表：系统会用「全职」类型的 URL 过滤去抓它们，
# 与上面的普通关键词（用 job_types 的实习/兼职过滤）分开，避免被当成"违法全职"误杀。
# 不需要（已毕业 / 不想投管培生）→ 留空即可。
#
# 提醒：这里的词同样计入免费版「最多 7 个」的额度。
#
# 填法举例：
# graduate_keywords:
#   - "management trainee"
#   - "graduate programme"
graduate_keywords: []

# 关键词同义词映射（可选）：value 里的词命中后，归入 key 所代表的主关键词。
# 用途举例：你写了 "data analyst"，但有些岗位标题写的是 "data analytics"，
#          把后者填进同义词，它就会被算作命中 "data analyst"。
# 规则：主关键词必须出现在上面的 keywords 列表里，否则它的同义词不会生效。
# 注意：同义词同样是子串匹配，所以同样只放岗位名称，不放技能名词。
# 填法举例：
# keyword_synonyms:
#   "data analyst": ["data analytics"]
keyword_synonyms: {}

# ---- 求职阶段（决定抓哪些岗位类型，★必填★）----
#   student  → 在读学生：只抓「实习 / 兼职」
#              （学生签证在读期间做全职是违法的，这是合规底线）
#   graduate → 已毕业 / 持 IANG：只抓「全职」（含管培生、毕业生培训计划）
#   both     → 毕业前后过渡期：实习、兼职、全职全都要
#
# 选错的影响：student 会漏掉所有全职岗；graduate 会漏掉所有实习岗。
# 不确定就先用 both，等看清哪类岗位更值得投，再收窄。
career_stage: student

location: "Hong Kong"          # 抓取目标地区

# ---- 岗位类型过滤（高级覆盖项，通常不用动）----
# ⚠️ 上面有了 career_stage 之后，这里【一般不需要写】：
#    程序会按 career_stage 自动推导 job_types。
#    只有当你想做 career_stage 覆盖不到的精细控制时，才手写这个列表
#    （例如 student 但想同时看全职）。一旦写了，就以你写的为准。
#
# 所有岗位在进入日报前还会过一道「岗位类型安全网」：不符合的类型直接剔除，
# 因此永远不会出现"URL 过滤没生效、混进违法全职岗"的情况。
# job_types:
#   - "internship"
#   - "part time"

# ---- 抓取频率与防封号（P0-2）----
poll_interval_minutes: 30      # 轮询间隔，推荐 15-30 分钟
human_delay:                   # 每次页面导航之间的随机延迟（秒），模拟人类操作
  min_s: 2
  max_s: 8
daily_limits:                  # 每站点"每日抓取页数"上限（香港自然日），触发即停并记日志
  jobsdb: 150
  linkedin: 40
  indeed: 40

# ---- 关键词轮转（每轮抓几个关键词，P0-2 配套）----
# 初筛是「逐关键词搜索」，每搜索一个关键词就吃掉 1–2 页每日配额（配额按香港自然日
# 0 点重置，不用就作废）。所以"每轮抓几个关键词"要跟你的开机习惯匹配：
#
#   → 电脑 24 小时常开：用 auto。auto = 每日配额 ÷ 当日轮数，把配额摊到全天，
#     避免开机头几小时烧光、之后一整天抓不到东西（那时全天都在空转）。
#   → 每天只开一小会儿：用 all。反正开机时间短，开一次就尽量把关键词全扫一遍，
#     配额不用白不用（配额按自然日 0 点重置，不用就作废）。
#
#   per_cycle: auto → 按每日配额 ÷ 当日轮数自动推算每轮抓几个（电脑常开时用这个）
#   per_cycle: all  → 每轮抓全部关键词（每天只开机十几分钟时用这个）
#   per_cycle: 5    → 每轮固定抓 5 个关键词
#
# per_source：按站点覆盖上面的值。LinkedIn 对自动化流量最敏感（而且每个关键词还要
# 翻 2 页），所以即便其他站一轮全量，也可以让它小步慢走、靠跨轮轮转慢慢覆盖全部关键词。
keyword_rotation:
  per_cycle: auto
  per_source:
    # linkedin: 3     # 想让最敏感的 LinkedIn 小步慢走，就把这行取消注释

# ---- 浏览器行为 ----
browser:
  headless: true               # 无头模式（不弹浏览器窗口）。实测有头模式翻多页会崩
                               # 溃（Page crashed），无头模式稳定且能正常过 Cloudflare。
  cloudflare_wait_seconds: 45  # 遇到挑战页的最长等待时间（只等待，绝不破解）

  # 浏览器走不走代理。如果直连香港网站很慢、或安全验证一直转圈，这一项
  # 就是给这种情况准备的。三种填法：
  #
  #   ""                      默认留空 → 强制直连，忽略系统代理设置。
  #   "system"                跟随系统里设的代理。代理软件开的是「系统代理
  #                           模式」时填这个。
  #   "http://127.0.0.1:7890" 指定具体地址（端口按你代理软件里显示的改）。
  #
  # 不确定填哪个：双击 doctor.bat，看「网络出口」那一项。它通了就不用改；
  # 不通且提示「检测到系统代理」就填 system。
  # 代理软件开的是 TUN / 虚拟网卡模式时，留空也能通（那种模式在网络层接管
  # 流量，浏览器感知不到），所以不必改这一项。
  proxy: ""

# ---- LLM 打分（P0-4）----
llm:
  provider: "deepseek"
  base_url: "https://api.deepseek.com"
  model: "deepseek-chat"
  # API key 的读取顺序：① 环境变量 ② 项目根目录的 api_key.txt
  # 最省事：在本文件同级目录建一个 api_key.txt，里面只写 sk- 开头那一串即可。
  # 也可以走环境变量（变量名在此指定，值永不写进配置/代码/日志）：
  #   PowerShell 临时： $env:DEEPSEEK_API_KEY = "sk-xxxx"
  #   PowerShell 永久： setx DEEPSEEK_API_KEY "sk-xxxx"（设置后要重开窗口）
  api_key_env: "DEEPSEEK_API_KEY"
  timeout_seconds: 20          # 单岗位打分超时（验收要求 <5 秒，留足网络余量）

score_threshold: 60            # 低于此分的岗位不进日报
realtime_threshold: 80         # ≥ 此分的新岗位不等日报、发现即推送
                               # （免费版不含"实时秒推"，这些岗位会并入每日日报，不会丢）
show_unscored: true            # LLM 打分失败降级为"未打分"的岗位是否仍进日报
                               # （默认 true：宁可多看，不可漏看）
max_job_age_days: 2            # 岗位新鲜度上限：只保留最近 N 天内发布的岗位（默认 2 天）

# =============================================================================
#  推送设置（★必须配好一个通道，否则收不到任何消息★）
# =============================================================================
# 四个通道【完全平等】，任选其一填在 channels 里即可。没有"默认通道"。
#
# 💡 免费版额度：只能启用【1 个】通道。写了多个不会报错——程序只用你写在
#    channels 列表里的第一个，其余忽略并提醒。想换通道就把想用的那个写到第一位。
#
# 怎么选（都是免费的）：
#   wecom    企业微信群机器人 —— 腾讯官方、免费、无条数上限、消息进微信。内地可用。
#            步骤：手机装「企业微信」→ 注册（企业名称随便填）→ 建一个只有自己的群
#                  → 群设置 → 群机器人 → 添加 → 复制 Webhook 地址，填到下面。
#            可选：在企业微信里「我 → 设置 → 微信绑定」，之后个人微信也能收。
#   email    邮件 —— 最通用，能发排好版的 HTML 岗位卡片，不需要任何第三方平台。
#            注意：auth_code 是邮箱后台生成的【授权码】，不是你的登录密码！
#            QQ 邮箱：设置 → 账户 → 开启 SMTP 服务 → 生成授权码。
#   telegram Telegram —— 需要能访问 Telegram 的网络环境（内地需自备网络条件）。
#            它与其它三个通道地位完全相同，不是特殊通道。
#            步骤：与 @BotFather 对话创建机器人拿 token；给机器人发一条 /start，
#                  再访问 https://api.telegram.org/bot<TOKEN>/getUpdates 取 chat_id。
#   wxpusher WxPusher —— 扫码即用，但属第三方服务、有免费额度上限。
#            步骤：打开 wxpusher.zjiecode.com → 微信扫码登录 → 创建应用拿 appToken
#                  → 「用户管理」里复制你的 UID。
#
# 只填你启用的那一个通道，其余整段保持默认即可。
notify:
  channels:
    - "wecom"                  # ← 改成你要用的通道：wecom / email / telegram / wxpusher

  wecom:
    webhook: ""                # 形如 https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxxx

  email:
    smtp_host: "smtp.qq.com"   # QQ 邮箱用这个；163 是 smtp.163.com；Gmail 是 smtp.gmail.com
    smtp_port: 465             # 465 = SSL；587 = STARTTLS（都能自动识别，按邮箱说明填）
    user: ""                   # 你的完整邮箱地址，如 you@qq.com
    auth_code: ""              # ★ 邮箱授权码，不是登录密码
    to: ""                     # 收件邮箱，可与 user 相同；多个用逗号分隔
    use_ssl: true

  telegram:
    bot_token: ""              # 与 @BotFather 创建的机器人 token，形如 123456:ABC-xxx
    chat_id: ""

  wxpusher:
    app_token: ""              # 形如 AT_xxxxxx
    uids: []                   # 你的 UID 列表，如 ["UID_xxxxxx"]

feedback_poll_seconds: 60      # 反馈按钮轮询间隔（仅 Telegram 支持点击反馈，其它通道会自动跳过）

# ---- 日报 ----
report_time: "09:00"           # 每日日报推送时间（香港时区，HH:MM）
                               # 免费版每天只推 1 次；手动补发随时可做（report_now）。
# report_times:                # 高级版：一天多个时间点（免费版会忽略这一段）
#   - "09:00"
#   - "18:30"
